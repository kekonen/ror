[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true

# Test configuration
gas_reports = ["*"]

# risc0 integration - allow reading test proofs
fs_permissions = [{ access = "read", path = "../../" }]

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
mainnet = "${ETH_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
