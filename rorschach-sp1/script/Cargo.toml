[package]
version = "0.1.0"
name = "rorschach-script"
edition = "2021"
default-run = "rorschach"

[[bin]]
name = "rorschach"
path = "src/main.rs"

[dependencies]
sp1-sdk = "5.0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
clap = { version = "4.0", features = ["derive"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
image = "0.25"

[build-dependencies]
sp1-build = "5.0.8"
